[build]
  command = 'pnpm build'
  publish = 'dist'

[build.environment]
  NODE_VERSION = '22'
  NETLIFY_USE_PNPM = 'true'

# SPA: all routes fall back to index.html
[[redirects]]
  from = '/*'
  to = '/index.html'
  status = 200

# hashed assets are immutable
[[headers]]
  for = '/assets/*'
  [headers.values]
    Cache-Control = 'public, max-age=31536000, immutable'
